
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | TimelessDL HD</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="navbar">
    <a href="index.html" class="logo">TIMELESS<span>DL</span> HD</a>
    <nav>
      <a href="index.html">Home</a>
      <a href="jobs.html">Find Jobs</a>
      <a href="post-job.html">Post a Job</a>
    </nav>
  </header>

  <main class="page-container auth-container">
    <section class="page-heading">
      <p class="eyebrow">WELCOME TO TIMELESSDL HD</p>
      <h1>Your next chapter <span>starts here.</span></h1>
      <p>Sign in or create an account to continue.</p>
    </section>

    <div class="form-card">
      <div class="auth-tabs">
        <button type="button" id="show-login" class="btn btn-primary">Sign In</button>
        <button type="button" id="show-register" class="btn btn-outline">Register</button>
      </div>

      <form id="login-form">
        <h2>Welcome back</h2>
        <label for="login-email">Email address</label>
        <input id="login-email" type="email" required placeholder="you@example.com">

        <label for="login-password">Password</label>
        <input id="login-password" type="password" required placeholder="Your password">

        <button type="submit" class="btn btn-primary">Sign In →</button>
      </form>

      <form id="register-form" hidden>
        <h2>Create your account</h2>

        <label for="register-name">Full name</label>
        <input id="register-name" required placeholder="Your full name">

        <label for="register-email">Email address</label>
        <input id="register-email" type="email" required placeholder="you@example.com">

        <label for="register-password">Create password</label>
        <input id="register-password" type="password" minlength="8" required placeholder="At least 8 characters">

        <label for="register-role">Account type</label>
        <select id="register-role" required>
          <option value="job_seeker">Job seeker</option>
          <option value="employer">Employer</option>
        </select>

        <button type="submit" class="btn btn-primary">Create Account →</button>
      </form>

      <p id="auth-message" role="status"></p>
    </div>
  </main>

  <footer>
    <a href="index.html" class="logo">TIMELESS<span>DL</span> HD</a>
    <p>Connecting opportunities with people.</p>
    <p>© 2026 TimelessDL HD. All rights reserved.</p>
  </footer>

  <script src="config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
