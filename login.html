<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login | TimelessDL HD</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  background: #080808;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
}

.login-wrapper {
  width: 100%;
  max-width: 420px;
}

.brand {
  text-align: center;
  margin-bottom: 30px;
}

.brand h1 {
  font-size: 30px;
  color: #e5b84b;
  letter-spacing: 1px;
}

.brand p {
  color: #999;
  margin-top: 8px;
  font-size: 13px;
}

.login-card {
  background: #151515;
  border: 1px solid #333;
  border-radius: 18px;
  padding: 35px 25px;
  box-shadow: 0 15px 50px rgba(0,0,0,.5);
}

.login-card h2 {
  font-size: 25px;
  margin-bottom: 10px;
}

.subtitle {
  color: #999;
  font-size: 14px;
  margin-bottom: 28px;
}

label {
  display: block;
  margin-bottom: 9px;
  font-size: 13px;
  color: #ddd;
}

.input-group {
  margin-bottom: 20px;
}

input {
  width: 100%;
  padding: 15px;
  background: #0b0b0b;
  border: 1px solid #383838;
  border-radius: 9px;
  color: white;
  outline: none;
  font-size: 14px;
}

input:focus {
  border-color: #e5b84b;
}

button {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 9px;
  background: linear-gradient(135deg,#f4d477,#c99728);
  color: #111;
  font-size: 15px;
  font-weight: bold;
  cursor: pointer;
  margin-top: 5px;
}

button:disabled {
  opacity: .6;
  cursor: wait;
}

#message {
  margin-top: 16px;
  font-size: 13px;
  text-align: center;
  color: #e5b84b;
  overflow-wrap: anywhere;
}

.register {
  text-align: center;
  margin-top: 25px;
  color: #999;
  font-size: 14px;
}

a {
  color: #e5b84b;
  text-decoration: none;
  font-weight: bold;
}

.footer {
  text-align: center;
  color: #666;
  font-size: 12px;
  margin-top: 25px;
}
</style>
</head>

<body>

<div class="login-wrapper">

  <div class="brand">
    <h1>TimelessDL HD</h1>
    <p>Your Gateway to Jobs and Opportunities</p>
  </div>

  <div class="login-card">
    <h2>Welcome Back</h2>
    <p class="subtitle">Sign in to continue to your account.</p>

    <form id="loginForm">

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" id="email"
        placeholder="Enter your email" required>
      </div>

      <div class="input-group">
        <label>Password</label>
        <input type="password" id="password"
        placeholder="Enter your password" required>
      </div>

      <button type="submit" id="loginBtn">Sign In</button>

    </form>

    <p id="message"></p>

    <div class="register">
      Don't have an account?
      <a href="register.html">Create Account</a>
    </div>
  </div>

  <div class="footer">
    © 2026 TimelessDL HD. All rights reserved.
  </div>

</div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const db = window.supabase.createClient(
  window.SUPABASE_URL,
  window.SUPABASE_ANON_KEY
);

const form = document.getElementById("loginForm");
const message = document.getElementById("message");
const button = document.getElementById("loginBtn");

form.addEventListener("submit", async function(e) {
  e.preventDefault();

  button.disabled = true;
  message.textContent = "Verifying your account...";

  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  const { data, error } = await db.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    message.textContent = error.message;
    button.disabled = false;
    return;
  }

  const { data: admin, error: adminError } = await db
    .from("admin_users")
    .select("user_id")
    .eq("user_id", data.user.id)
    .maybeSingle();

  if (adminError) {
    message.textContent = "Admin verification failed: " + adminError.message;
    button.disabled = false;
    return;
  }

  if (admin) {
    window.location.href = "admin.html";
  } else {
    window.location.href = "dashboard.html";
  }
});
</script>

</body>
</html>
